# --- Groq, reviewed 2026-07-24 --------------------------------------------------------
# Groq DOES publish free-plan limits per model, and they apply at the ORGANIZATION level,
# not per API key. Observed 2026-07-24 (recorded for Phase 4 sizing only — not config):
#   llama-3.3-70b-versatile   30 RPM / 1K RPD / 12K TPM / 100K TPD
#   llama-3.1-8b-instant      30 RPM / 14.4K RPD / 6K TPM / 500K TPD
#   openai/gpt-oss-120b       30 RPM / 1K RPD / 8K TPM / 200K TPD
#   openai/gpt-oss-20b        30 RPM / 1K RPD / 8K TPM / 200K TPD
# TOKENS-PER-DAY BINDS LONG BEFORE REQUESTS-PER-DAY for this workload, and on some models
# TPM is smaller than a single chapter round-trip. Phase 4/6 must treat TPM/TPD as the
# binding constraint and the ETA must say so. Groq returns retry-after plus
# x-ratelimit-{limit,remaining,reset}-{requests,tokens}, so its capabilities should report
# exposes_rate_limits = true.
# Groq offers NO Qwen model in its production lineup as of this review.
# Whisper (audio) and groq/compound (agentic system) are excluded as out-of-contract.

[[ai.approved_models]]
id = "llama-3.3-70b-versatile"
provider = "groq"
status = "stable"
context_limit = 131072
output_limit = 32768
reviewed_on = "2026-07-24"
source_url = "https://console.groq.com/docs/models"
free_tier_confidence = "confirmed"
pilot_status = "not-piloted"

