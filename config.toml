# Committed application defaults. This file must never contain credentials.
[project]
name = "Web Novel Editor"
version = "0.12.0"
python_minimum = "3.10"

[ai]
enabled = false
provider = "ollama"
# The out-of-the-box model the GUI pre-selects once the user opts in. Chosen from the
# Phase 8 stratified pilot (DECISIONS #058): qwen3:14b gave 98% mask acceptance with only
# legitimate minimal edits, where 8b intermittently corrupted non-protected words the gate
# cannot catch. This is the default when AI is enabled — it does NOT turn AI on (see
# `enabled = false` above). Leaving it blank falls back to no pre-selection (IN_CODE_DEFAULTS).
model = "qwen3:14b"
timeout_seconds = 120
endpoint = "http://127.0.0.1:11434"
keep_alive = "30m"
# Pilot-validated limits (Phase 8): actual prompt_eval_count p50 ~2,680 / max ~4,531 tokens
# sat well under context_limit, so the conservative bytes/3 estimator over-reserves in the
# fail-safe direction. No change warranted by evidence (upholds DECISIONS #053).
context_limit = 32768
max_output_tokens = 4096
request_overhead_tokens = 128
context_safety_margin_tokens = 256
output_margin_tokens = 64
seed = 0
# Strategy M (mask): mask protected terms before the model sees them. The Phase 8 pilot
# confirmed M beats Strategy V (verify) for protected-term safety on both models. (DECISIONS #058.)
protection_strategy = "mask"
prompt_version = "1"
gate_version = "1"

# ---------------------------------------------------------------------------
# Approved cloud models (Plan 2b Phase 0 — reviewed 2026-07-24)
# ---------------------------------------------------------------------------
# Reviewed records replace runtime "pick the newest model" selection. Each entry is an
# EXACT model ID — never a `latest`-style alias, which can hot-swap onto a preview model.
#
# WHAT THIS LIST IS: a conservative guard against *accidentally* calling something
# expensive or retired. It is user-editable TOML, so it is NOT a security or billing
# boundary and must never be described as one.
#
# `free_tier_confidence` records only whether the provider's own documentation states the
# model is free of charge. It says NOTHING about quota size — see the per-provider notes
# below. Code must not read any number out of the comments in this file.
#
# fields: id, provider, status, context_limit, output_limit, reviewed_on, source_url,
#         free_tier_confidence (confirmed | unknown | not-free), pilot_status
#
# --- Gemini, reviewed 2026-07-24 ------------------------------------------------------
# QUOTA IS UNKNOWN AND UNPUBLISHED. Google's own rate-limits page no longer prints a
# free-tier RPM/TPM/RPD table; it states rate limits "can be viewed in Google AI Studio"
# and are applied PER PROJECT, not per API key. RPD quotas reset at midnight Pacific.
# Treat every free-tier Gemini number found on a third-party site as unverified.
# Free-of-charge status below comes from Google's own pricing page ("Free of charge",
# Standard tier). Preview models are deliberately excluded even when priced free.
# Gemini does not document response rate-limit headers, so capabilities for this provider
# should report exposes_rate_limits = false and rely on a conservative configured floor.

[[ai.approved_models]]
id = "gemini-3.6-flash"
provider = "gemini"
status = "stable"
context_limit = 1048576
output_limit = 65536
reviewed_on = "2026-07-24"
source_url = "https://ai.google.dev/gemini-api/docs/models/gemini-3.6-flash"
free_tier_confidence = "confirmed"
pilot_status = "not-piloted"

