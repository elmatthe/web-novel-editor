# Committed application defaults. This file must never contain credentials.
[project]
name = "Web Novel Editor"
version = "0.12.0"
python_minimum = "3.10"

[ai]
enabled = false
provider = "ollama"
# The out-of-the-box model the GUI pre-selects once the user opts in. Chosen from the
# Phase 8 stratified pilot (DECISIONS #058): qwen3:14b gave 98% mask acceptance with only
# legitimate minimal edits, where 8b intermittently corrupted non-protected words the gate
# cannot catch. This is the default when AI is enabled — it does NOT turn AI on (see
# `enabled = false` above). Leaving it blank falls back to no pre-selection (IN_CODE_DEFAULTS).
model = "qwen3:14b"
timeout_seconds = 120
endpoint = "http://127.0.0.1:11434"
keep_alive = "30m"
# Pilot-validated limits (Phase 8): actual prompt_eval_count p50 ~2,680 / max ~4,531 tokens
# sat well under context_limit, so the conservative bytes/3 estimator over-reserves in the
# fail-safe direction. No change warranted by evidence (upholds DECISIONS #053).
context_limit = 32768
max_output_tokens = 4096
request_overhead_tokens = 128
context_safety_margin_tokens = 256
output_margin_tokens = 64
seed = 0
# Strategy M (mask): mask protected terms before the model sees them. The Phase 8 pilot
# confirmed M beats Strategy V (verify) for protected-term safety on both models. (DECISIONS #058.)
protection_strategy = "mask"
prompt_version = "1"
gate_version = "1"

# ---------------------------------------------------------------------------
# Cloud providers (Plan 2b Phase 1) — SECRET-FREE SETTINGS ONLY
# ---------------------------------------------------------------------------
# No API key belongs in this file, ever. Keys are read from the GEMINI_API_KEY /
# GROQ_API_KEY environment variables, or from secrets.json in the per-user application
# data directory (%LOCALAPPDATA%/WebNovelEditor on Windows) — never from the repo.
#
# Both providers ship `enabled = false` and `model = ""`. An empty model is deliberate:
# the Plan 2b Phase 7 comparison run chooses the default, so nothing pre-selects a cloud
# model before that evidence exists. Until one is chosen the provider reports
# "no model selected" rather than guessing.
#
# `strict_free_tier_only = true` is the safety default. With it on, only approved models
# that are `status = "stable"` AND `free_tier_confidence = "confirmed"` may be called;
# anything `unknown`, `not-free`, or preview is refused outright.
#
# `exposes_rate_limits` records which provider actually returns rate-limit headers, and
# the two differ (Phase 0 correction #4): Groq returns retry-after plus
# x-ratelimit-{limit,remaining,reset}-{requests,tokens}; Google documents no equivalent,
# so Gemini must run off a conservative configured floor. Phase 4 owns those floors.
#
# --- Phase 4 limiter floors (added 2026-07-25) ----------------------------------------
# READ THIS BEFORE CHANGING A NUMBER BELOW. These are **client-side self-restraint**,
# NOT a claim about what the provider's real limit is. They exist so the FIRST request
# of a run cannot exceed a limit before any rate-limit header has been seen. Where a
# provider returns real headers (Groq), a live header always wins over the floor here;
# where it does not (Gemini), these are the only pacing evidence that exists, so they
# are set well below anything published rather than at it. Nothing in the limiter code
# contains a limit — every figure it uses comes from this file.
#
#   rpm_floor                requests/minute the client will not exceed unaided
#                            (0 = no minimum interval)
#   tpm_floor                tokens/minute the client will not exceed unaided
#                            (0 = not modelled — the honest value when no figure exists)
#   rate_limit_floor_seconds wait applied to a 429 that carries no usable number
#   backoff_base_seconds     first transient-error backoff, doubled per attempt
#   backoff_max_seconds      hard cap on any single backoff — no unbounded growth
#   backoff_jitter_ratio     fraction of a backoff that is randomised (transients only)
#   max_attempts             total attempts per request, including the first
#   max_wait_seconds         any wait longer than this is NOT slept: the run stops
#                            cleanly through the quota seam instead (Phase 5 resumes it)

[ai.gemini]
enabled = false
model = ""
timeout_seconds = 120
max_output_tokens = 4096
strict_free_tier_only = true
exposes_rate_limits = false
billing_url = "https://aistudio.google.com/app/plan_information"
limits_url = "https://ai.google.dev/gemini-api/docs/rate-limits"
# Gemini's free quota is unknowable from documentation (Phase 0 correction #2, re-confirmed
# Phase 2 finding #10) and Google returns no rate-limit headers at all, so there is no
# number to read and none may be invented. 10 RPM is a deliberately cautious chosen pace,
# not a published limit. tpm_floor is 0 because no token figure exists to base one on —
# guessing one would be exactly the invention this plan forbids.
rpm_floor = 10
tpm_floor = 0
rate_limit_floor_seconds = 30
backoff_base_seconds = 2
backoff_max_seconds = 60
backoff_jitter_ratio = 0.3
max_attempts = 3
max_wait_seconds = 900
# A run must not spend forever retrying a 429 that never says WHICH limit it is. After
# this many seconds of unexplained limit errors with no successful request in between,
# the limiter stops cleanly and checkpoints instead of guessing "per minute" again. Set
# to 0 to disable. Phase 7b measured ~35 minutes of futile Gemini calls without it.
unnamed_limit_escalation_seconds = 600

[ai.groq]
enabled = false
model = ""
timeout_seconds = 120
max_output_tokens = 4096
strict_free_tier_only = true
exposes_rate_limits = true
billing_url = "https://console.groq.com/settings/billing"
limits_url = "https://console.groq.com/settings/limits"
# Groq publishes per-model free-plan limits and returns live headers, so these floors only
# govern the opening request of a run and any response whose headers were missing or
# unreadable. Both are set below the smallest documented free-plan figure across the four
# approved models (reviewed 2026-07-25) so no model can be paced past its own limit before
# a header arrives; the header always wins afterwards.
rpm_floor = 15
tpm_floor = 5000
rate_limit_floor_seconds = 30
backoff_base_seconds = 2
backoff_max_seconds = 60
backoff_jitter_ratio = 0.3
max_attempts = 3
max_wait_seconds = 900
# A run must not spend forever retrying a 429 that never says WHICH limit it is. After
# this many seconds of unexplained limit errors with no successful request in between,
# the limiter stops cleanly and checkpoints instead of guessing "per minute" again. Set
# to 0 to disable. Phase 7b measured ~35 minutes of futile Gemini calls without it.
unnamed_limit_escalation_seconds = 600

# ---------------------------------------------------------------------------
# Approved cloud models (Plan 2b Phase 0 — reviewed 2026-07-24)
# ---------------------------------------------------------------------------
# Reviewed records replace runtime "pick the newest model" selection. Each entry is an
# EXACT model ID — never a `latest`-style alias, which can hot-swap onto a preview model.
#
# WHAT THIS LIST IS: a conservative guard against *accidentally* calling something
# expensive or retired. It is user-editable TOML, so it is NOT a security or billing
# boundary and must never be described as one.
#
# `free_tier_confidence` records only whether the provider's own documentation states the
# model is free of charge. It says NOTHING about quota size — see the per-provider notes
# below. Code must not read any number out of the comments in this file.
#
# fields: id, provider, status, context_limit, output_limit, reviewed_on, source_url,
#         free_tier_confidence (confirmed | unknown | not-free), pilot_status
#
# --- Gemini, reviewed 2026-07-24 ------------------------------------------------------
# QUOTA IS UNKNOWN AND UNPUBLISHED. Google's own rate-limits page no longer prints a
# free-tier RPM/TPM/RPD table; it states rate limits "can be viewed in Google AI Studio"
# and are applied PER PROJECT, not per API key. RPD quotas reset at midnight Pacific.
# Treat every free-tier Gemini number found on a third-party site as unverified.
# Free-of-charge status below comes from Google's own pricing page ("Free of charge",
# Standard tier). Preview models are deliberately excluded even when priced free.
# Gemini does not document response rate-limit headers, so capabilities for this provider
# should report exposes_rate_limits = false and rely on a conservative configured floor.

[[ai.approved_models]]
id = "gemini-3.6-flash"
provider = "gemini"
status = "stable"
context_limit = 1048576
output_limit = 65536
reviewed_on = "2026-07-24"
source_url = "https://ai.google.dev/gemini-api/docs/models/gemini-3.6-flash"
free_tier_confidence = "confirmed"
pilot_status = "not-piloted"

